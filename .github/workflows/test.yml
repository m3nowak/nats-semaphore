name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        nats-version: ["2.7"]
        include:
          - python-version: "3.10"
            nats-version: "2.8"
          - python-version: "3.10"
            nats-version: "2.9"
          - python-version: "3.10"
            nats-version: "2.10"
          - python-version: "3.10"
            nats-version: "2.11"
          - python-version: "3.10"
            nats-version: "2.12"
          - python-version: "3.10"
            nats-version: "2.14"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise run setup
      - name: Test with pytest
        env:
          NATS_CONTAINER_VERSION: ${{ matrix.nats-version }}
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: mise run test
